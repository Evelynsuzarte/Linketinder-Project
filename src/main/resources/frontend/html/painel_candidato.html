<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/painel_candidato_style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cagliostro&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Tilt+Warp&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../../images/logo.png">
    <title>Painel - Linketinder</title>
</head>
<body>

<header>
    <nav>
        <span><a href="../html/index.html"><img class="logo" src="../../images/logo.png" alt="logo"></a></span>
        <ul>
            <li><a href="">Home</a></li>
            <li><a href="painel_candidato.html">Vagas</a></li>
            <li><a href="painel_candidato.html">Perfil</a></li>
            <li><a href="index.html">Logoff</a></li>
        </ul>
    </nav>
</header>

<main>
    <section class="painel-candidato">
        <div class="cabecalho-painel">
            <h1>Painel de vagas</h1>
            <p>Encontre a oportunidade ideal ou acompanhe suas candidaturas.</p>
        </div>

        <div class="filtros-container">
            <label for="filtro-vagas"><strong>Filtrar por:</strong></label>
            <select id="filtro-vagas" name="filtro-vagas" class="select-filtro">
                <option value="novas">Novas vagas disponíveis</option>
                <option value="cadastradas">Minhas vagas inscritas</option>
            </select>
        </div>

        <div class="tabela-container">
            <table class="tabela-vagas">
                <thead>
                <tr>
                    <th>Cargo</th>
                    <th>Descrição da vaga</th>
                    <th>Competências exigidas</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <!-- As linhas e os botões (Inscrever-se / Cancelar interesse) são criados pelo TypeScript -->
                <tbody id="lista-vagas-disponiveis"></tbody>
            </table>
        </div>
    </section>
</main>
<footer>
    <span>Evelyn Suzarte Fernandes - ACZG 2026.2</span>
</footer>
<script type="module" src="../js/painel_candidato.js"></script>

</body>
</html>
