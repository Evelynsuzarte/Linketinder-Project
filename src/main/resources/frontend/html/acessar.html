<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/acessar_style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cagliostro&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Tilt+Warp&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../../images/logo.png">
    <title>Login - Linketinder</title>
</head>
<body>

<header>
    <nav>
        <span><a href="../html/index.html"><img class="logo" src="../../images/logo.png" alt="logo"></a></span>
    </nav>
</header>

<main>

    <section class="logar">
        <h1>Iniciar sessão</h1>
        <form class="formulario-login" id="meuFormulario">
            <div class="login-informacoes">
                <div class="form-email">
                    <label>Email:</label>
                    <input type="email" placeholder="O seu email" required>
                </div>

                <div class="form-senha">
                    <label>Palavra-passe:</label>
                    <input type="password" placeholder="A sua palavra-passe" required>
                </div>
            </div>

            <button type="submit" class="btn-enviar">Entrar</button>
        </form>
    </section>
</main>
<footer>
    <span>Evelyn Suzarte Fernandes - ACZG 2026.2</span>
</footer>
<script src="../js/acesso.js" type="module"></script>

</body>
</html>
